<!doctype html>
<html lang="ca" data-tema="auto" data-mida="normal">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Família</title>
  <meta name="theme-color" content="#1F5FBF">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icones/icona-192.png">
  <link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Família">
  <link rel="stylesheet" href="estil.css">
</head>
<body>
  <div id="franja" class="franja" hidden></div>
  <header id="barra" class="barra"></header>
  <main id="vista" class="vista" tabindex="-1"></main>
  <nav id="nav" class="nav" aria-label="Seccions"></nav>

  <div id="avis-flotant" class="toast" role="status" aria-live="polite" hidden></div>

  <!-- Full inferior per a detalls -->
  <dialog id="full" class="full"></dialog>

  <!-- Confirmació lliscant per a accions destructives -->
  <dialog id="dialeg-llisca" class="dialeg">
    <p id="llisca-text" class="llisca-text"></p>
    <div class="llisca">
      <input id="llisca" type="range" min="0" max="100" value="0" aria-label="Llisca per confirmar">
      <span id="llisca-etiqueta">Llisca per esborrar →</span>
    </div>
    <button id="llisca-cancel" class="boto secundari ample">Cancel·la</button>
  </dialog>

  <script src="config.js"></script>
  <script src="js/dades.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
